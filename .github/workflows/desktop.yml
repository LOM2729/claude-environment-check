name: Desktop build and verification
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['desktop/**', 'src/**', 'tools/build.py', 'VERSION', '.github/workflows/desktop.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing draft release tag; use with artifact_run_id to retry attachment verification'
        required: false
        default: ''
      artifact_run_id:
        description: 'Existing run whose two desktop package jobs succeeded for the release commit'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  package:
    if: github.event_name != 'workflow_dispatch' || inputs.artifact_run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: '--mac zip --arm64'
            artifact: macos-arm64
          - os: windows-latest
            target: '--win zip --x64'
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r desktop/requirements-build.txt
      - run: npm ci --prefix desktop
      - run: npm test --prefix desktop
      - run: python -m unittest discover -s tests -p test_desktop_backend.py -v
      - run: python desktop/build_backend.py
      - run: python desktop/smoke_backend.py
      - run: npx --prefix desktop electron-builder --projectDir desktop ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}-${{ github.sha }}
          path: desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  release-assets:
    if: >-
      always() && ((github.ref_type == 'tag' && needs.package.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' &&
      inputs.artifact_run_id != '' && needs.package.result == 'skipped'))
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Bind artifacts to the checked-out release commit and successful package jobs
        shell: bash
        run: |
          set -euo pipefail
          echo "TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          python - <<'PY'
          import json, os, subprocess
          run_id = os.environ['ARTIFACT_RUN_ID']
          assert run_id.isdecimal()
          repo = os.environ['GH_REPO']
          target = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          run = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}']))
          assert run['head_sha'] == target and run['path'] == '.github/workflows/desktop.yml'
          jobs = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}/jobs?per_page=100']))['jobs']
          packages = [j for j in jobs if j['name'].startswith('package (')]
          assert len(packages) == 2 and all(j['conclusion'] == 'success' for j in packages)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/build.py
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*-${{ env.TARGET_SHA }}
          path: release-desktop
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify embedded kits and prepare attachment hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          assert os.environ['RELEASE_TAG'] == 'v' + version
          desktop = sorted(Path('release-desktop').rglob('*.zip'))
          expected = {f'Claude-Environment-Desktop-{version}-{target}.zip'
                      for target in ('mac-arm64', 'win-x64')}
          assert len(desktop) == 2 and {p.name for p in desktop} == expected
          with zipfile.ZipFile('dist/Claude-Setup-Kit.zip') as kit:
              canonical = {n.removeprefix('Claude-Setup-Kit/'): kit.read(n)
                           for n in kit.namelist()}
          for path in desktop:
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None, path.name
                  roots = [n[:-len('PACKAGE-INFO.json')] for n in archive.namelist()
                           if n.endswith('/kit/PACKAGE-INFO.json')]
                  assert len(roots) == 1, path.name
                  prefix = roots[0]
                  assert {n[len(prefix):] for n in archive.namelist()
                          if n.startswith(prefix) and not n.endswith('/')} == set(canonical)
                  for relative, data in canonical.items():
                      embedded = archive.read(prefix + relative)
                      if relative == 'PACKAGE-INFO.json':
                          assert json.loads(embedded) == json.loads(data), path.name
                      elif relative != 'SHA256SUMS.txt':
                          assert embedded == data, (path.name, relative)
                  # Generated metadata can use platform-native newlines. Verify
                  # its actual bytes against the embedded manifest, while all
                  # source files above must still match the tagged source.
                  hashes = {}
                  for line in archive.read(prefix + 'SHA256SUMS.txt').decode().splitlines():
                      digest, relative = line.split('  ', 1)
                      assert relative not in hashes
                      hashes[relative] = digest
                  assert set(hashes) == set(canonical) - {'SHA256SUMS.txt'}
                  for relative, digest in hashes.items():
                      assert hashlib.sha256(archive.read(prefix + relative)).hexdigest() == digest
          files = desktop + [Path('dist/Claude-Setup-Kit.zip'),
                             Path('dist/Claude-Setup-Kit.zip.sha256')]
          manifest = {p.name: {'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
                              'bytes': p.stat().st_size} for p in files}
          sums = Path('dist/SHA256SUMS.txt')
          sums.write_text(''.join(f'{manifest[name]["sha256"]}  {name}\n'
                                  for name in sorted(manifest)))
          manifest[sums.name] = {'sha256': hashlib.sha256(sums.read_bytes()).hexdigest(),
                                 'bytes': sums.stat().st_size}
          Path('dist/release-validation.json').write_text(json.dumps({
              'tag': os.environ['RELEASE_TAG'], 'commit': os.environ['TARGET_SHA'],
              'embedded_kits_match_source': True, 'assets': manifest}, indent=2) + '\n')
          PY
      - name: Attach verified files to existing draft only
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" --clobber dist/Claude-Setup-Kit.zip dist/Claude-Setup-Kit.zip.sha256 dist/SHA256SUMS.txt release-desktop/*/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-validation-${{ env.TARGET_SHA }}
          path: |
            dist/release-validation.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
