<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640"><ns0:rect width="1080" height="640" fill="#f7f9fc" /><ns0:defs><ns0:marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><ns0:path d="M0 0 L8 4 L0 8" fill="#7890aa" /></ns0:marker></ns0:defs><ns0:text x="30" y="43" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#17304b">轻量配置工具：功能关系图（需求已确认）</ns0:text><ns0:path d="M220 142 L270 142" fill="none" stroke="#7890aa" stroke-width="2" marker-end="url(#a)" /><ns0:path d="M520 142 L570 142" fill="none" stroke="#7890aa" stroke-width="2" marker-end="url(#a)" /><ns0:path d="M815 142 L865 142" fill="none" stroke="#7890aa" stroke-width="2" marker-end="url(#a)" /><ns0:path d="M385 205 L385 275" fill="none" stroke="#7890aa" stroke-width="2" marker-end="url(#a)" /><ns0:path d="M685 275 L685 205" fill="none" stroke="#7890aa" stroke-width="2" marker-end="url(#a)" /><ns0:path d="M270 205 L145 455" fill="none" stroke="#7890aa" stroke-width="2" marker-end="url(#a)" /><ns0:path d="M550 395 L550 455" fill="none" stroke="#7890aa" stroke-width="2" marker-end="url(#a)" /><ns0:rect x="20" y="80" width="200" height="125" rx="10" fill="white" stroke="#c9d6e5" /><ns0:text x="35" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#17304b">客户〔用户已确认〕</ns0:text><ns0:text x="35" y="138" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">自己操作小工具</ns0:text><ns0:text x="35" y="159" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">异常交由你处理</ns0:text><ns0:rect x="270" y="80" width="250" height="125" rx="10" fill="white" stroke="#c9d6e5" /><ns0:text x="285" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#17304b">自动识别〔已确认〕</ns0:text><ns0:text x="285" y="138" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">读取开启状态、当前选择</ns0:text><ns0:text x="285" y="159" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">查找完整配置和代理链</ns0:text><ns0:rect x="570" y="80" width="245" height="125" rx="10" fill="white" stroke="#c9d6e5" /><ns0:text x="585" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#17304b">YAML 副本〔已确认〕</ns0:text><ns0:text x="585" y="138" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">沿用客户节点／链路</ns0:text><ns0:text x="585" y="159" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">独立保存，原文件保留</ns0:text><ns0:rect x="865" y="80" width="195" height="125" rx="10" fill="white" stroke="#c9d6e5" /><ns0:text x="880" y="112" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#17304b">导入与复测</ns0:text><ns0:text x="880" y="138" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">客户导入 Clash</ns0:text><ns0:text x="880" y="159" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">对比修改前后结果</ns0:text><ns0:rect x="270" y="275" width="545" height="120" rx="10" fill="white" stroke="#c9d6e5" /><ns0:text x="285" y="307" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#17304b">现有浏览器〔用户已确认〕</ns0:text><ns0:text x="285" y="333" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">工具打开 Net.Coffee 的 IP／DNS／WebRTC 页面</ns0:text><ns0:text x="285" y="354" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">客户人工核对并记录；不把“已打开”当作“检测通过”</ns0:text><ns0:rect x="20" y="455" width="245" height="135" rx="10" fill="white" stroke="#c9d6e5" /><ns0:text x="35" y="487" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#17304b">识别失败〔已确认〕</ns0:text><ns0:text x="35" y="513" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">提示选择 Clash 导出的配置</ns0:text><ns0:text x="35" y="534" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">仍不完整：列出具体缺口</ns0:text><ns0:text x="35" y="555" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">不猜凭据或代理链</ns0:text><ns0:rect x="345" y="455" width="470" height="135" rx="10" fill="white" stroke="#c9d6e5" /><ns0:text x="360" y="487" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#17304b">问题处理〔用户已确认〕</ns0:text><ns0:text x="360" y="513" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">给出浏览器／系统操作指引</ns0:text><ns0:text x="360" y="534" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">暂不自动修改系统 DNS、浏览器或当前连接</ns0:text><ns0:text x="360" y="555" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">实现：独立系统窗口，复用已有配置引擎</ns0:text></ns0:svg>