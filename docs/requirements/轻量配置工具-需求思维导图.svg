<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640"><ns0:rect width="1080" height="640" fill="#f7f9fc" /><ns0:defs><ns0:marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><ns0:path d="M0 0 L8 4 L0 8" fill="#7890aa" /></ns0:marker></ns0:defs><ns0:text x="30" y="43" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#17304b">轻量配置工具：需求思维导图（需求已确认）</ns0:text><ns0:path d="M325 290 L390 142" fill="none" stroke="#7890aa" stroke-width="2" marker-end="url(#a)" /><ns0:path d="M325 298 L390 310" fill="none" stroke="#7890aa" stroke-width="2" marker-end="url(#a)" /><ns0:path d="M325 310 L390 490" fill="none" stroke="#7890aa" stroke-width="2" marker-end="url(#a)" /><ns0:rect x="25" y="238" width="300" height="120" rx="10" fill="white" stroke="#c9d6e5" /><ns0:text x="40" y="270" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#17304b">轻量配置工具</ns0:text><ns0:text x="40" y="296" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">用户已确认：体积和操作均精简</ns0:text><ns0:text x="40" y="317" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">用户已确认：客户自助，你处理异常</ns0:text><ns0:rect x="390" y="75" width="655" height="135" rx="10" fill="white" stroke="#c9d6e5" /><ns0:text x="405" y="107" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#17304b">已有配置与新副本</ns0:text><ns0:text x="405" y="133" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">用户已确认：沿用 Clash 节点／代理链，输出 YAML</ns0:text><ns0:text x="405" y="154" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">用户已确认：自动读取；资料不足时选择导出文件</ns0:text><ns0:text x="405" y="175" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">用户已确认：保持完整链路和必要配置，无法确认时提示缺口</ns0:text><ns0:rect x="390" y="245" width="655" height="135" rx="10" fill="white" stroke="#c9d6e5" /><ns0:text x="405" y="277" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#17304b">网络检测与问题处理</ns0:text><ns0:text x="405" y="303" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">用户已确认：打开原检测页，客户人工核对</ns0:text><ns0:text x="405" y="324" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">用户已确认：生成 YAML，并给浏览器／系统操作指引</ns0:text><ns0:text x="405" y="345" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">暂不做：内嵌浏览器、自动判定泄漏、自动改系统设置</ns0:text><ns0:rect x="390" y="415" width="655" height="160" rx="10" fill="white" stroke="#c9d6e5" /><ns0:text x="405" y="447" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#17304b">第一版边界与验收</ns0:text><ns0:text x="405" y="473" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">用户已确认：延续现有 Mac／Windows 范围，界面收成一页</ns0:text><ns0:text x="405" y="494" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">用户已确认：不覆盖原文件、不自动启用新配置</ns0:text><ns0:text x="405" y="515" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">用户已确认：当前这台小火箭不得关闭或切换</ns0:text><ns0:text x="405" y="536" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="14" fill="#17304b">用户已确认：独立 App 小窗口，自动识别与文件回退</ns0:text></ns0:svg>